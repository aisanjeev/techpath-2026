# docker-compose.yml — Module 15 Code Snap
# Run: docker-compose up
# Stop: docker-compose down

version: "3.8"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - SECRET_KEY=change-this-in-production
      - DEBUG=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
