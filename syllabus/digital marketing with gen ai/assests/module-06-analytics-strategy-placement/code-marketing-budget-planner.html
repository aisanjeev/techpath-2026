<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Budget Planner — TechPath Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #ff6f00 0%, #ff8f00 100%);
            color: white;
            padding: 28px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .input-section {
            padding: 30px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }

        .input-row {
            display: flex;
            gap: 20px;
            align-items: flex-end;
        }

        @media (max-width: 600px) {
            .input-row {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #ff6f00;
            box-shadow: 0 0 0 3px rgba(255, 111, 0, 0.1);
        }

        .rupee-input {
            position: relative;
        }

        .rupee-input::before {
            content: '\20B9';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #666;
            font-weight: 600;
        }

        .rupee-input input {
            padding-left: 30px;
        }

        .calculate-btn {
            padding: 12px 30px;
            background: #ff6f00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .calculate-btn:hover {
            background: #e65100;
            transform: translateY(-1px);
        }

        /* Results */
        .results {
            display: none;
            padding: 30px;
        }

        .results.show {
            display: block;
        }

        .totals-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .totals-row {
                flex-direction: column;
            }
        }

        .total-card {
            flex: 1;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px 20px;
            text-align: center;
        }

        .total-card .label {
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .total-card .value {
            font-size: 22px;
            font-weight: 800;
            color: #1a237e;
            margin-top: 4px;
        }

        .total-card .sub {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        /* Pie Chart */
        .chart-section {
            display: flex;
            gap: 30px;
            margin-bottom: 25px;
            align-items: center;
        }

        @media (max-width: 600px) {
            .chart-section {
                flex-direction: column;
            }
        }

        .pie-container {
            width: 220px;
            height: 220px;
            flex-shrink: 0;
        }

        .pie-chart {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            position: relative;
        }

        .legend {
            flex: 1;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .legend-name {
            flex: 1;
            font-size: 13px;
            color: #555;
        }

        .legend-amount {
            font-size: 13px;
            font-weight: 700;
            color: #333;
        }

        .legend-percent {
            font-size: 12px;
            color: #999;
            width: 35px;
            text-align: right;
        }

        /* Editable Allocation */
        .allocation-section {
            margin-top: 25px;
        }

        .allocation-title {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .allocation-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: #fafafa;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #eee;
        }

        .allocation-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .allocation-name {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            color: #444;
        }

        .allocation-slider {
            width: 120px;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
        }

        .allocation-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff6f00;
            cursor: pointer;
        }

        .allocation-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff6f00;
            cursor: pointer;
            border: none;
        }

        .allocation-percent {
            width: 40px;
            text-align: right;
            font-size: 14px;
            font-weight: 700;
            color: #1a237e;
        }

        .allocation-amount {
            width: 90px;
            text-align: right;
            font-size: 13px;
            color: #555;
        }

        .total-warning {
            text-align: center;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .total-warning.over {
            background: #fce4ec;
            color: #c62828;
        }

        .total-warning.under {
            background: #fff3e0;
            color: #e65100;
        }

        .total-warning.perfect {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .stage-info {
            margin-top: 20px;
            padding: 15px;
            background: #e8eaf6;
            border-radius: 8px;
            border-left: 4px solid #1a237e;
        }

        .stage-info h4 {
            font-size: 14px;
            color: #1a237e;
            margin-bottom: 6px;
        }

        .stage-info p {
            font-size: 12px;
            color: #555;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Marketing Budget Planner</h1>
                <p>Plan your monthly marketing spend across channels based on your business stage</p>
            </div>

            <div class="input-section">
                <div class="input-row">
                    <div class="input-group">
                        <label>Total Monthly Budget</label>
                        <div class="rupee-input">
                            <input type="number" id="total-budget" placeholder="100000" min="5000" step="5000">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Business Stage</label>
                        <select id="business-stage">
                            <option value="startup">Startup (0-1 year old)</option>
                            <option value="growth" selected>Growth (1-3 years)</option>
                            <option value="mature">Mature (3+ years)</option>
                        </select>
                    </div>
                    <button class="calculate-btn" onclick="calculateBudget()">Plan Budget</button>
                </div>
            </div>

            <div class="results" id="results">
                <!-- Totals -->
                <div class="totals-row">
                    <div class="total-card">
                        <div class="label">Monthly Budget</div>
                        <div class="value" id="monthly-total">--</div>
                    </div>
                    <div class="total-card">
                        <div class="label">Annual Budget</div>
                        <div class="value" id="annual-total">--</div>
                    </div>
                    <div class="total-card">
                        <div class="label">Daily Budget</div>
                        <div class="value" id="daily-total">--</div>
                        <div class="sub">approx. per day</div>
                    </div>
                </div>

                <!-- Chart + Legend -->
                <div class="chart-section">
                    <div class="pie-container">
                        <div class="pie-chart" id="pie-chart"></div>
                    </div>
                    <div class="legend" id="legend"></div>
                </div>

                <!-- Editable Allocations -->
                <div class="allocation-section">
                    <div class="allocation-title">Adjust Allocations (drag sliders)</div>
                    <div id="allocation-list"></div>
                    <div class="total-warning" id="total-warning"></div>
                </div>

                <!-- Stage Info -->
                <div class="stage-info" id="stage-info"></div>
            </div>
        </div>

        <div class="footer">
            TechPath Academy — Digital Marketing with Gen AI Program | Budget Planner Tool
        </div>
    </div>

    <script>
        const channels = [
            { name: 'SEO & Content', color: '#1565c0' },
            { name: 'Paid Ads (Google + Meta)', color: '#e53935' },
            { name: 'Social Media', color: '#7b1fa2' },
            { name: 'Email & WhatsApp', color: '#2e7d32' },
            { name: 'Influencer / Partnerships', color: '#ff6f00' },
            { name: 'Tools & Software', color: '#00838f' }
        ];

        const stageAllocations = {
            startup: {
                percentages: [30, 25, 20, 10, 5, 10],
                title: 'Startup Stage (0-1 Year)',
                description: 'Focus on building organic presence and testing paid channels. Invest heavily in SEO and content to build a foundation that compounds over time. Keep paid ads experimental with small budgets. Social media builds brand awareness cheaply.'
            },
            growth: {
                percentages: [25, 35, 15, 10, 10, 5],
                title: 'Growth Stage (1-3 Years)',
                description: 'Scale what works. Increase paid ads budget as you have data on what converts. SEO should be generating consistent traffic by now. Add influencer partnerships for social proof and reach. Email becomes a revenue driver.'
            },
            mature: {
                percentages: [20, 30, 15, 15, 10, 10],
                title: 'Mature Stage (3+ Years)',
                description: 'Optimize for efficiency and lifetime value. Email and retention marketing become more important. Invest in better tools and automation. Paid ads focus on ROAS optimization rather than experimentation. Content maintains SEO dominance.'
            }
        };

        let currentAllocations = [];
        let totalBudget = 0;

        function calculateBudget() {
            totalBudget = parseInt(document.getElementById('total-budget').value) || 0;
            const stage = document.getElementById('business-stage').value;

            if (totalBudget < 5000) {
                alert('Please enter a budget of at least Rs 5,000');
                return;
            }

            currentAllocations = [...stageAllocations[stage].percentages];

            // Show results
            document.getElementById('results').classList.add('show');

            // Update totals
            document.getElementById('monthly-total').textContent = formatRupees(totalBudget);
            document.getElementById('annual-total').textContent = formatRupees(totalBudget * 12);
            document.getElementById('daily-total').textContent = formatRupees(Math.round(totalBudget / 30));

            // Stage info
            const stageData = stageAllocations[stage];
            document.getElementById('stage-info').innerHTML = `
                <h4>${stageData.title} — Recommended Allocation</h4>
                <p>${stageData.description}</p>
            `;

            updateVisuals();
        }

        function updateVisuals() {
            updatePieChart();
            updateLegend();
            updateAllocationSliders();
            updateTotalWarning();
        }

        function updatePieChart() {
            const pieEl = document.getElementById('pie-chart');
            let gradientParts = [];
            let cumulative = 0;

            currentAllocations.forEach((pct, index) => {
                const start = cumulative;
                cumulative += pct;
                gradientParts.push(`${channels[index].color} ${start}% ${cumulative}%`);
            });

            // Fill remaining with light gray if under 100
            if (cumulative < 100) {
                gradientParts.push(`#e0e0e0 ${cumulative}% 100%`);
            }

            pieEl.style.background = `conic-gradient(${gradientParts.join(', ')})`;
        }

        function updateLegend() {
            const legendEl = document.getElementById('legend');
            let html = '';

            currentAllocations.forEach((pct, index) => {
                const amount = Math.round(totalBudget * pct / 100);
                html += `
                    <div class="legend-item">
                        <div class="legend-color" style="background:${channels[index].color}"></div>
                        <div class="legend-name">${channels[index].name}</div>
                        <div class="legend-amount">${formatRupees(amount)}</div>
                        <div class="legend-percent">${pct}%</div>
                    </div>
                `;
            });

            legendEl.innerHTML = html;
        }

        function updateAllocationSliders() {
            const listEl = document.getElementById('allocation-list');
            let html = '';

            currentAllocations.forEach((pct, index) => {
                const amount = Math.round(totalBudget * pct / 100);
                html += `
                    <div class="allocation-item">
                        <div class="allocation-color" style="background:${channels[index].color}"></div>
                        <div class="allocation-name">${channels[index].name}</div>
                        <input type="range" class="allocation-slider" min="0" max="60" value="${pct}"
                            oninput="updateSlider(${index}, this.value)">
                        <div class="allocation-percent" id="percent-${index}">${pct}%</div>
                        <div class="allocation-amount" id="amount-${index}">${formatRupees(amount)}</div>
                    </div>
                `;
            });

            listEl.innerHTML = html;
        }

        function updateSlider(index, value) {
            currentAllocations[index] = parseInt(value);
            document.getElementById(`percent-${index}`).textContent = value + '%';
            document.getElementById(`amount-${index}`).textContent = formatRupees(Math.round(totalBudget * value / 100));

            updatePieChart();
            updateLegend();
            updateTotalWarning();
        }

        function updateTotalWarning() {
            const total = currentAllocations.reduce((sum, val) => sum + val, 0);
            const warningEl = document.getElementById('total-warning');

            if (total === 100) {
                warningEl.className = 'total-warning perfect';
                warningEl.textContent = 'Total: 100% — Budget fully allocated';
            } else if (total > 100) {
                warningEl.className = 'total-warning over';
                warningEl.textContent = `Total: ${total}% — Over budget by ${total - 100}%. Reduce some allocations.`;
            } else {
                warningEl.className = 'total-warning under';
                warningEl.textContent = `Total: ${total}% — ${100 - total}% unallocated. You have Rs ${formatRupees(Math.round(totalBudget * (100 - total) / 100))} left to assign.`;
            }
        }

        function formatRupees(amount) {
            if (amount >= 10000000) {
                return 'Rs ' + (amount / 10000000).toFixed(1) + ' Cr';
            } else if (amount >= 100000) {
                return 'Rs ' + (amount / 100000).toFixed(1) + ' L';
            } else {
                return 'Rs ' + amount.toLocaleString('en-IN');
            }
        }
    </script>
</body>
</html>
