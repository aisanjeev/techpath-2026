<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Formula Playground — TechPath Institute</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: #3b82f6;
    font-size: 1.8rem;
    margin-bottom: 5px;
  }

  .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 0.9rem;
    margin-bottom: 25px;
  }

  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e293b;
    padding: 12px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .score-item {
    text-align: center;
  }

  .score-item .label {
    font-size: 0.75rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .score-item .value {
    font-size: 1.4rem;
    font-weight: 700;
    color: #3b82f6;
  }

  .score-item .value.green { color: #22c55e; }
  .score-item .value.red { color: #ef4444; }

  .level-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .level-btn {
    padding: 8px 20px;
    border: 2px solid #334155;
    background: transparent;
    color: #94a3b8;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    transition: all 0.2s;
  }

  .level-btn:hover {
    border-color: #3b82f6;
    color: #e2e8f0;
  }

  .level-btn.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: #fff;
  }

  .spreadsheet-section {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .spreadsheet-title {
    font-size: 0.85rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .spreadsheet {
    width: 100%;
    border-collapse: collapse;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 0.95rem;
    overflow-x: auto;
    display: block;
  }

  .spreadsheet thead th {
    background: #334155;
    color: #94a3b8;
    padding: 8px 14px;
    text-align: center;
    font-weight: 600;
    border: 1px solid #475569;
    position: sticky;
    top: 0;
  }

  .spreadsheet thead th:first-child {
    background: #334155;
    color: #64748b;
    width: 40px;
  }

  .spreadsheet tbody td {
    padding: 8px 14px;
    border: 1px solid #334155;
    text-align: right;
    background: #0f172a;
  }

  .spreadsheet tbody td:first-child {
    text-align: center;
    color: #64748b;
    background: #1e293b;
    font-weight: 600;
  }

  .spreadsheet tbody td.text-cell {
    text-align: left;
  }

  .spreadsheet tbody td.highlight {
    background: #1e3a5f;
    border-color: #3b82f6;
  }

  .challenge-section {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .challenge-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .challenge-number {
    font-size: 0.8rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .function-tag {
    background: #312e81;
    color: #a5b4fc;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .challenge-question {
    font-size: 1.1rem;
    color: #e2e8f0;
    margin-bottom: 15px;
    line-height: 1.5;
  }

  .hint-text {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 15px;
    font-style: italic;
  }

  .input-row {
    display: flex;

  }

  .formula-input {
    flex: 1;
    min-width: 200px;

    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 8px;
    color: #e2e8f0;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .formula-input:focus {
    border-color: #3b82f6;
  }

  .formula-input::placeholder {
    color: #475569;
  }

  .check-btn {
    padding: 12px 24px;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .check-btn:hover {
    background: #2563eb;
  }

  .skip-btn {

    background: transparent;
    color: #94a3b8;
    border: 2px solid #334155;
    border-radius: 8px;

    font-family: inherit;
    font-size: 0.9rem;

  .skip-btn:hover {
    border-color: #64748b;
    color: #e2e8f0;
  }

  .feedback {
    padding: 12px 16px;

    font-size: 0.95rem;
    display: none;
    line-height: 1.5;
  }

  .feedback.correct {

    color: #4ade80;

  }

  .feedback.incorrect {
    background: #450a0a;
    border: 1px solid #991b1b;
    color: #fca5a5;
    display: block;
  }

  .feedback.info {
    background: #1e1b4b;
    border: 1px solid #3730a3;
    color: #a5b4fc;
    display: block;
  }

  .progress-bar-container {
    width: 100%;
    height: 6px;
    background: #334155;
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #22c55e);
    border-radius: 3px;

  .next-btn {

    color: #fff;
    border: none;
    border-radius: 8px;

    font-family: inherit;

    font-weight: 600;

let currentLevel = 1;
let currentChallenge = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;

function renderSpreadsheet(levelData) {
  const table = document.getElementById('spreadsheet');
  const data = levelData.data;
  let html = '<thead><tr>';
  data.headers.forEach(h => { html += '<th>' + h + '</th>'; });
  html += '</tr><tr>';
  data.subHeaders.forEach(h => { html += '<th style="font-weight:400;font-size:0.8rem;color:#64748b;">' + h + '</th>'; });
  html += '</tr></thead><tbody>';

  data.rows.forEach((row, ri) => {
    html += '<tr>';
    row.forEach((cell, ci) => {
      let cls = '';
      if (ci === 0) cls = '';
      else if (data.textCols && data.textCols.includes(ci)) cls = ' class="text-cell"';
      html += '<td' + cls + ' data-row="' + ri + '" data-col="' + ci + '">' + cell + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;
}

function highlightCells(highlights) {
  // Clear previous highlights
  document.querySelectorAll('.spreadsheet td.highlight').forEach(td => td.classList.remove('highlight'));

  if (!highlights) return;
  highlights.forEach(([row, col]) => {
    const td = document.querySelector('.spreadsheet td[data-row="' + row + '"][data-col="' + (col + 1) + '"]');
    if (td) td.classList.add('highlight');
  });
}

function renderChallenge() {
  const level = levels[currentLevel];
  const challenge = level.challenges[currentChallenge];

  document.getElementById('challenge-number').textContent = 'Challenge ' + (currentChallenge + 1) + ' of ' + level.challenges.length;
  document.getElementById('function-tag').textContent = challenge.tag;
  document.getElementById('challenge-question').innerHTML = challenge.question;
  document.getElementById('hint-text').textContent = 'Hint: ' + challenge.hint;
  document.getElementById('formula-input').value = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('check-btn').disabled = false;
  document.getElementById('question-progress').textContent = (currentChallenge + 1) + '/' + level.challenges.length;

  const progressPct = (currentChallenge / level.challenges.length) * 100;
  document.getElementById('progress-bar').style.width = progressPct + '%';

  highlightCells(challenge.highlights);
  answered = false;

  document.getElementById('formula-input').focus();
}

function normalizeFormula(formula) {
  return formula.trim().toUpperCase().replace(/\s+/g, '');
}

function checkAnswer() {
  if (answered) return;

  const input = document.getElementById('formula-input').value.trim();
  const level = levels[currentLevel];
  const challenge = level.challenges[currentChallenge];
  const feedback = document.getElementById('feedback');

  if (!input) {
    feedback.className = 'feedback info';
    feedback.innerHTML = 'Please type a formula before checking.';
    feedback.style.display = 'block';
    return;
  }

  const normalized = normalizeFormula(input);
  const isCorrect = challenge.answers.some(ans => normalizeFormula(ans) === normalized);

  if (isCorrect) {
    score += 10;
    correctCount++;
    feedback.className = 'feedback correct';
    feedback.innerHTML = '<strong>Correct!</strong> ' + challenge.correctAnswer + ' = ' + challenge.result;
  } else {
    wrongCount++;
    feedback.className = 'feedback incorrect';
    feedback.innerHTML = '<strong>Not quite.</strong> The correct formula is: <strong>' + challenge.correctAnswer + '</strong> (Result: ' + challenge.result + ')';
  }

  feedback.style.display = 'block';
  answered = true;
  document.getElementById('check-btn').disabled = true;

  updateScore();

  if (currentChallenge < level.challenges.length - 1) {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = 'Next Challenge';
  } else {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = 'See Results';
  }
}

function skipQuestion() {
  if (answered) return;
  const level = levels[currentLevel];
  const challenge = level.challenges[currentChallenge];
  const feedback = document.getElementById('feedback');

  wrongCount++;
  feedback.className = 'feedback info';
  feedback.innerHTML = '<strong>Skipped.</strong> The correct formula was: <strong>' + challenge.correctAnswer + '</strong> (Result: ' + challenge.result + ')';
  feedback.style.display = 'block';
  answered = true;
  document.getElementById('check-btn').disabled = true;

  updateScore();

  if (currentChallenge < level.challenges.length - 1) {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = 'Next Challenge';
  } else {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = 'See Results';
  }
}

function nextQuestion() {
  const level = levels[currentLevel];
  if (currentChallenge < level.challenges.length - 1) {
    currentChallenge++;
    renderChallenge();
  } else {
    showComplete();
  }
}

function showComplete() {
  document.getElementById('challenge-section').style.display = 'none';
  const completeSection = document.getElementById('complete-section');
  completeSection.style.display = 'block';

  const total = levels[currentLevel].challenges.length;
  const pct = Math.round((correctCount / total) * 100);

  document.getElementById('progress-bar').style.width = '100%';

  if (pct >= 80) {
    document.getElementById('complete-title').textContent = 'Excellent!';
    document.getElementById('complete-title').style.color = '#22c55e';
  } else if (pct >= 50) {
    document.getElementById('complete-title').textContent = 'Good Effort!';
    document.getElementById('complete-title').style.color = '#3b82f6';
  } else {
    document.getElementById('complete-title').textContent = 'Keep Practicing!';
    document.getElementById('complete-title').style.color = '#eab308';
  }

  document.getElementById('complete-message').textContent =
    'You got ' + correctCount + ' out of ' + total + ' correct (' + pct + '%). Score: ' + score + ' points.';

  const nextLevelBtn = document.getElementById('next-level-btn');
  if (currentLevel < 3) {
    nextLevelBtn.style.display = 'inline-block';
    nextLevelBtn.textContent = 'Try Level ' + (currentLevel + 1);
  } else {
    nextLevelBtn.style.display = 'none';
  }
}

function updateScore() {
  document.getElementById('score').textContent = score;
  document.getElementById('correct-count').textContent = correctCount;
  document.getElementById('wrong-count').textContent = wrongCount;
  document.getElementById('current-level').textContent = currentLevel;
}

function setLevel(level) {
  currentLevel = level;
  currentChallenge = 0;
  // Reset level-specific counts only
  const levelTotal = levels[level].challenges.length;

  document.querySelectorAll('.level-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i + 1 === level);
  });

  renderSpreadsheet(levels[level]);
  document.getElementById('challenge-section').style.display = 'block';
  document.getElementById('complete-section').style.display = 'none';
  renderChallenge();
  updateScore();
}

function restartLevel() {
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  currentChallenge = 0;

  document.getElementById('challenge-section').style.display = 'block';
  document.getElementById('complete-section').style.display = 'none';
  renderChallenge();
  updateScore();
}

function nextLevel() {
  if (currentLevel < 3) {
    score = 0;
    correctCount = 0;
    wrongCount = 0;
    setLevel(currentLevel + 1);
  }
}

// Handle Enter key
document.getElementById('formula-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (!answered) {
      checkAnswer();
    } else {
      nextQuestion();
    }
  }
});

// Initialize
setLevel(1);
</script>
</body>
</html>
