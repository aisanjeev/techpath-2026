# =============================================================================
# GitHub Actions CI/CD Pipeline — TechPath Capstone Project
# =============================================================================
# This workflow does two things:
#   1. CI (Continuous Integration): Runs tests, linting, and type checking
#      on every push and pull request
#   2. CD (Continuous Deployment): Deploys to Render when tests pass on main
#
# How to use:
#   1. Copy this file to .github/workflows/ci-cd.yml in your project
#   2. Push to GitHub
#   3. Go to your repo's "Actions" tab to see it run
#   4. For deployment, add secrets in Settings → Secrets → Actions
#
# Required secrets (add in GitHub repo Settings → Secrets → Actions):
#   - RENDER_API_KEY: Your Render API key
#   - RENDER_SERVICE_ID: Your Render web service ID
#   - OPENAI_API_KEY: For AI feature tests (optional)
# =============================================================================

name: CI/CD Pipeline

# When does this workflow run?
on:
  push:
    branches: [main, develop]    # Run on pushes to main or develop
  pull_request:
    branches: [main]             # Run on PRs targeting main

# What jobs does it run?
jobs:

  # -------------------------------------------------------------------------
  # Job 1: Lint and Format Check
  # -------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      # Step 4: Check code formatting with Black
      - name: Check formatting (Black)
        run: black --check app/ tests/

      # Step 5: Check for code issues with Ruff
      - name: Lint with Ruff
        run: ruff check app/ tests/

      # Step 6: Check types with MyPy
      - name: Type check with MyPy
        run: mypy app/ --ignore-missing-imports

  # -------------------------------------------------------------------------
  # Job 2: Run Tests
  # -------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint    # Only run tests if linting passes

    # Spin up a PostgreSQL container for testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # Wait until PostgreSQL is ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache pip packages so subsequent runs are faster
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If using pyproject.toml + poetry:
          # pip install poetry && poetry install
          # If using requirements.txt:
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        env:
          # Use the PostgreSQL service container
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb
          SECRET_KEY: test-secret-key-not-for-production
          # Optional: OpenAI key for AI feature tests
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html \
            -v

      # Fail if test coverage drops below 60%
      - name: Check minimum coverage
        run: |
          pytest tests/ --cov=app --cov-fail-under=60

      # Save the HTML coverage report as an artifact
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # -------------------------------------------------------------------------
  # Job 3: Deploy to Render (only on main branch, after tests pass)
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test                             # Only deploy if tests pass
    if: github.ref == 'refs/heads/main'     # Only deploy from main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Trigger a deploy on Render via their API
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Deploying to Render..."
          curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
          echo "Deploy triggered successfully!"

      # Wait a bit and check if the app is healthy
      - name: Health check (wait for deploy)
        run: |
          echo "Waiting 60 seconds for deploy to complete..."
          sleep 60
          echo "Checking health endpoint..."
          # Replace with your actual production URL
          # curl -f https://your-app.onrender.com/api/v1/health || echo "Health check failed — check Render dashboard"
          echo "Deploy complete. Check your Render dashboard for status."

  # -------------------------------------------------------------------------
  # Job 4: Notify on failure (optional — sends a message if tests fail)
  # -------------------------------------------------------------------------
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: failure()    # Only run if previous jobs failed

    steps:
      - name: Log failure
        run: |
          echo "CI/CD pipeline failed!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo ""
          echo "Check the Actions tab for details:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"


# =============================================================================
# Setup Instructions for Students:
#
# 1. Create this file at: .github/workflows/ci-cd.yml
#
# 2. Add secrets to your GitHub repo:
#    - Go to Settings → Secrets and variables → Actions
#    - Click "New repository secret"
#    - Add RENDER_API_KEY and RENDER_SERVICE_ID
#
# 3. Push to GitHub:
#    git add .github/workflows/ci-cd.yml
#    git commit -m "Add CI/CD pipeline"
#    git push origin develop
#
# 4. Open a PR from develop → main and watch the tests run!
#
# 5. When you merge to main, the deploy job will trigger automatically.
# =============================================================================
