# =============================================================================
# CD Workflow — Build Docker Image & Deploy
# =============================================================================
# This workflow runs AFTER a push/merge to the main branch.
# It only runs if the CI (test) workflow has passed.
#
# What it does:
#   1. Builds a Docker image of the application
#   2. Pushes the image to GHCR (GitHub Container Registry)
#   3. Deploys to the server via SSH (pulls the new image and restarts)
#
# Project: TechPath Institute — Student Management API
# Author: Ananya (DevOps Team, TechPath Institute, Pune)
# =============================================================================

name: CD — Build & Deploy Pipeline

# -----------------------------------------------------------------------------
# TRIGGERS: Only run on push/merge to main
# -----------------------------------------------------------------------------
# We do NOT want to deploy on every push to every branch.
# Deployment should only happen when code is merged into "main" —
# meaning it has already passed CI checks and code review.
#
# Think of it like the TechPath Institute admission process:
#   - Students apply (push to feature branch)
#   - Applications are reviewed (Pull Request + CI checks)
#   - Only approved students get enrolled (merge to main = deploy)
# -----------------------------------------------------------------------------
on:
  push:
    branches:
      - main          # Only deploy when code is merged to main

# -----------------------------------------------------------------------------
# PERMISSIONS: What can this workflow do?
# -----------------------------------------------------------------------------
# We need to:
#   - Read the repository contents (to build the Docker image)
#   - Write to the container registry (to push the Docker image)
#
# By default, GITHUB_TOKEN has limited permissions. We explicitly
# request what we need — this is the "principle of least privilege."
# -----------------------------------------------------------------------------
permissions:
  contents: read       # Read repo code
  packages: write      # Push to GHCR (GitHub Container Registry)

# -----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES: Shared across all jobs
# -----------------------------------------------------------------------------
# These are NOT secrets — they are just convenient names.
# The actual Docker image will be: ghcr.io/your-username/your-repo
# -----------------------------------------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# -----------------------------------------------------------------------------
# JOBS
# -----------------------------------------------------------------------------
jobs:

  # ===========================================================================
  # JOB 1: BUILD — Build and push Docker image to GHCR
  # ===========================================================================
  build:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # OUTPUT: Share the image tag with the deploy job
    # -------------------------------------------------------------------------
    # Jobs run on separate machines, so they cannot share data directly.
    # We use "outputs" to pass the image tag from the build job to deploy job.
    # -------------------------------------------------------------------------
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1: CHECKOUT — Get the code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: SET UP DOCKER BUILDX — Enable advanced Docker features
      # -----------------------------------------------------------------------
      # Buildx is Docker's next-generation build tool. It supports:
      #   - Multi-platform builds (build for ARM and x86 simultaneously)
      #   - Build caching (faster rebuilds)
      #   - Better layer management
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Step 3: LOG IN TO GHCR — Authenticate with GitHub Container Registry
      # -----------------------------------------------------------------------
      # GHCR stores Docker images right next to your GitHub repo.
      # We log in using the automatically-provided GITHUB_TOKEN.
      #
      # Note: ${{ github.actor }} is your GitHub username — it is
      # automatically set by GitHub Actions. No need to configure it.
      # -----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Step 4: EXTRACT METADATA — Generate image tags and labels
      # -----------------------------------------------------------------------
      # This creates meaningful tags for our Docker image:
      #   - "latest" — always points to the newest build
      #   - The commit SHA (e.g., "sha-a1b2c3d") — for rollback
      #
      # Labels add metadata like the commit author, branch, and build date.
      # -----------------------------------------------------------------------
      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # -----------------------------------------------------------------------
      # Step 5: BUILD AND PUSH — Create the Docker image and upload it
      # -----------------------------------------------------------------------
      # This step:
      #   1. Reads the Dockerfile in the repo root
      #   2. Builds the image layer by layer
      #   3. Tags it with the tags from Step 4
      #   4. Pushes it to GHCR
      #
      # "cache-from" and "cache-to" use GitHub's built-in cache to speed
      # up rebuilds. If only one file changed, Docker reuses unchanged layers.
      #
      # Imagine Vikram building a multi-storey building:
      #   - If only the top floor needs changes, he does not rebuild
      #     the foundation — he reuses it from the cache!
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                          # Build from the repo root
          push: true                          # Push to GHCR after building
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha               # Use GitHub Actions cache
          cache-to: type=gha,mode=max        # Save to GitHub Actions cache

      # -----------------------------------------------------------------------
      # Step 6: VERIFY — Confirm the image was pushed successfully
      # -----------------------------------------------------------------------
      - name: Verify image was pushed
        run: |
          echo "Docker image built and pushed successfully!"
          echo "Image tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "You can pull this image with:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  # ===========================================================================
  # JOB 2: DEPLOY — Deploy to the server
  # ===========================================================================
  # This job runs AFTER the build job completes successfully.
  # It connects to the server via SSH and deploys the new Docker image.
  #
  # SECRETS REQUIRED (add these in GitHub repo Settings → Secrets):
  #   - DEPLOY_HOST: Server IP or hostname (e.g., "api.techpath.biz")
  #   - DEPLOY_USER: SSH username (e.g., "deploy")
  #   - DEPLOY_SSH_KEY: SSH private key (the full key including BEGIN/END lines)
  # ===========================================================================
  deploy:
    name: "Deploy to Server"
    runs-on: ubuntu-latest
    needs: build                   # Wait for build job to finish

    # -------------------------------------------------------------------------
    # ENVIRONMENT: Name shown in GitHub's deployment tracking
    # -------------------------------------------------------------------------
    environment:
      name: production
      url: https://api.techpath.biz

    steps:
      # -----------------------------------------------------------------------
      # Step 1: DEPLOY VIA SSH — Connect to server and update the app
      # -----------------------------------------------------------------------
      # appleboy/ssh-action is a popular action that:
      #   1. Connects to your server via SSH
      #   2. Runs the commands you specify in the "script" section
      #
      # The script does:
      #   - Navigate to the app directory on the server
      #   - Log in to GHCR (to pull private images)
      #   - Pull the latest Docker image
      #   - Restart the containers using docker compose
      #   - Clean up old, unused images to save disk space
      #
      # Like Neha updating the TechPath Institute website:
      #   she SSHs into the server, pulls the latest code, and restarts.
      # -----------------------------------------------------------------------
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "Starting deployment on server..."

            # Navigate to the application directory
            cd /home/${{ secrets.DEPLOY_USER }}/techpath-api

            # Log in to GHCR to pull the latest image
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest image from GHCR
            docker compose pull

            # Restart the containers with the new image
            # --force-recreate ensures the container uses the new image
            # -d runs in detached mode (background)
            docker compose up -d --force-recreate

            # Remove old, unused images to save disk space
            docker image prune -f

            echo "Deployment complete!"

      # -----------------------------------------------------------------------
      # Step 2: HEALTH CHECK — Verify the deployment worked
      # -----------------------------------------------------------------------
      # After deploying, we check if the API is responding correctly.
      # We wait a few seconds for the container to start, then hit
      # the health check endpoint.
      #
      # If the API does not respond, the step fails and we know
      # something went wrong with the deployment.
      # -----------------------------------------------------------------------
      - name: Verify deployment (health check)
        run: |
          echo "Waiting for the application to start..."
          sleep 15

          echo "Checking API health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.techpath.biz/api/v1/health)

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Health check PASSED! API is running (HTTP $HTTP_STATUS)"
          else
            echo "Health check FAILED! API returned HTTP $HTTP_STATUS"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 3: NOTIFY — Post deployment status (optional)
      # -----------------------------------------------------------------------
      # You can integrate with Slack, Discord, or email to notify the team.
      # This example prints a summary — replace with a real notification
      # action if your team uses Slack/Discord.
      # -----------------------------------------------------------------------
      - name: Deployment summary
        if: success()
        run: |
          echo "====================================="
          echo "  DEPLOYMENT SUCCESSFUL"
          echo "====================================="
          echo "  App:     TechPath Student API"
          echo "  Branch:  ${{ github.ref_name }}"
          echo "  Commit:  ${{ github.sha }}"
          echo "  Author:  ${{ github.actor }}"
          echo "  Image:   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  URL:     https://api.techpath.biz"
          echo "====================================="
