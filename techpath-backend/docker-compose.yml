version: '3.8'

services:
  # FastAPI Backend
  backend:
    build: .
    container_name: techpath-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://techpath:techpath123@mysql:3306/techpath
      - STORAGE_TYPE=local
      - LOCAL_UPLOAD_PATH=/app/data/uploads
      - DEBUG=true
      - LOG_LEVEL=INFO
      - SECRET_KEY=dev-secret-key-change-in-production
      - CORS_ORIGINS=["http://localhost:4321", "http://localhost:3000"]
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: techpath-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: techpath
      MYSQL_USER: techpath
      MYSQL_PASSWORD: techpath123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: techpath-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

