<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <!-- TECH -->
  <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#techGradient)">TECH</text>
  <!-- P with path design -->
  <g transform="translate(118, 0)">
    <!-- Main P shape -->
    <path d="M8 8 L8 40 M8 8 L28 8 C40 8 40 24 28 24 L8 24" stroke="url(#pathGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Path arrow element -->
    <path d="M28 24 L44 24 C52 24 52 8 44 8 L36 8" stroke="url(#pathGradient)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="44" cy="8" r="4" fill="#06b6d4"/>
  </g>
  <!-- ATH -->
  <text x="170" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#techGradient)">ATH</text>
</svg>
